[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "endstone-bot"
version = "4.3.4"
description = "Production-oriented SimulatedPlayer management for Endstone: quotas, per-player overrides, GUI and console administration."
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
requires-python = ">=3.10"
keywords = ["minecraft", "bedrock", "bds", "endstone", "fake-player", "simulated-player"]
authors = [{ name = "BCZZB" }]
maintainers = [{ name = "ReallocAll" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment",
]

[project.urls]
Homepage = "https://github.com/ReallocAll/endstone-bot"
Repository = "https://github.com/ReallocAll/endstone-bot"
Issues = "https://github.com/ReallocAll/endstone-bot/issues"
Upstream = "https://github.com/BCZZB/endstone-bot"

[project.entry-points."endstone"]
bot = "endstone_bot:BotPlugin"

[tool.setuptools.packages.find]
where = ["."]
include = ["endstone_bot*"]
namespaces = true

[tool.setuptools.package-data]
endstone_bot = [
    "behavior_pack/manifest.json",
    "behavior_pack/scripts/*.js",
]
