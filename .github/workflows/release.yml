name: Build & Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Package version X.Y.Z already committed on main
        required: true
        type: string
      dry_run:
        description: Validate and build without publishing
        type: boolean
        default: true

concurrency:
  group: bot-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  prepare:
    name: Validate release intent
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      publish: ${{ steps.meta.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - id: meta
        run: python tools/release_metadata.py

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        run: python -m unittest tests.test_settings tests.test_models tests.test_bridge tests.test_behavior_pack tests.test_manager_source tests.test_boundaries tests.test_level_dat tests.test_beta_script tests.test_release -v

      - name: Compile Python sources
        run: python -m compileall -q endstone_bot

      - name: Execute bridge boundary tests
        run: node tests/bridge_runtime.cjs

      - name: Check behavior-pack JavaScript syntax
        run: node --check endstone_bot/behavior_pack/scripts/main.js

  wheel:
    name: Universal wheel (py3-none-any)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install build backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build universal wheel
        run: python -m build --wheel

      - name: Verify universal wheel
        shell: python
        run: |
          from pathlib import Path
          wheels = list(Path("dist").glob("*.whl"))
          assert len(wheels) == 1, wheels
          wheel = wheels[0]
          assert wheel.name.endswith("-py3-none-any.whl"), wheel.name
          print(wheel)

      - name: Verify wheel contents and entry point
        run: python -m unittest tests.test_wheel -v

      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          path: dist/*.whl
          archive: false
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [prepare, wheel]
    runs-on: ubuntu-latest
    if: needs.prepare.outputs.publish == 'true' && github.repository == 'ReallocAll/endstone-bot'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: endstone_bot-*.whl
          path: artifacts
          merge-multiple: true
          skip-decompress: true

      - name: Verify tested wheel and record checksum
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          test "$(find artifacts -name '*.whl' | wc -l)" -eq 1
          test -f "artifacts/endstone_bot-$VERSION-py3-none-any.whl"
          cd artifacts
          sha256sum *.whl > SHA256SUMS

      - name: Create immutable tag after all validation
        uses: actions/github-script@v8
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        with:
          script: |
            const tag = `v${process.env.VERSION}`;
            try {
              await github.rest.repos.getReleaseByTag({...context.repo, tag});
              throw new Error(`Release ${tag} already exists; refusing to overwrite`);
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            let existing;
            try {
              existing = await github.rest.git.getRef({...context.repo, ref: `tags/${tag}`});
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (existing) {
              let object = existing.data.object;
              while (object.type === 'tag') {
                object = (await github.rest.git.getTag({...context.repo, tag_sha: object.sha})).data.object;
              }
              if (object.type !== 'commit' || object.sha !== context.sha) {
                throw new Error(`Refusing to move existing tag ${tag}`);
              }
            } else {
              await github.rest.git.createRef({...context.repo, ref: `refs/tags/${tag}`, sha: context.sha});
            }

      - name: Publish versioned release without overwriting
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "v$VERSION" --repo "$REPO" --verify-tag \
            --title "v$VERSION" --generate-notes \
            --notes 'Install the wheel and its matching bundled behavior pack together while BDS is stopped, then fully restart. See README for inventory conflict recovery and migration.' \
            artifacts/*.whl artifacts/SHA256SUMS
