name: Build & Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        run: python -m unittest tests.test_settings tests.test_models tests.test_bridge tests.test_behavior_pack tests.test_manager_source tests.test_boundaries tests.test_level_dat tests.test_beta_script -v

      - name: Compile Python sources
        run: python -m compileall -q endstone_bot

      - name: Execute bridge boundary tests
        run: node tests/bridge_runtime.cjs

      - name: Check behavior-pack JavaScript syntax
        run: node --check endstone_bot/behavior_pack/scripts/main.js

  wheel:
    name: Universal wheel (py3-none-any)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install build backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build universal wheel
        run: python -m build --wheel

      - name: Verify universal wheel
        shell: python
        run: |
          from pathlib import Path
          wheels = list(Path("dist").glob("*.whl"))
          assert len(wheels) == 1, wheels
          wheel = wheels[0]
          assert wheel.name.endswith("-py3-none-any.whl"), wheel.name
          print(wheel)

      - name: Verify wheel contents and entry point
        run: python -m unittest tests.test_wheel -v

      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          path: dist/*.whl
          archive: false
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: wheel
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.repository == 'ReallocAll/endstone-bot' && github.ref == 'refs/heads/main' && github.event_name == 'push' && github.event.head_commit.message == 'release: bot 4.7.0 verified protocol 3')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: endstone_bot-*.whl
          path: artifacts
          merge-multiple: true
          skip-decompress: true

      - name: Verify release wheel and record checksum
        shell: bash
        run: |
          test "$(find artifacts -name '*.whl' | wc -l)" -eq 1
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            test -f artifacts/endstone_bot-4.7.0-py3-none-any.whl
          fi
          cd artifacts
          sha256sum *.whl > SHA256SUMS

      - name: Refuse an existing one-time release tag
        if: github.ref == 'refs/heads/main'
        uses: actions/github-script@v8
        with:
          script: |
            try {
              await github.rest.git.getRef({...context.repo, ref: 'tags/v4.7.0'});
            } catch (error) {
              if (error.status === 404) return;
              throw error;
            }
            throw new Error('v4.7.0 already exists; refusing to change it');

      - name: Create Release and attach wheel
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v4.7.0' }}
          target_commitish: ${{ github.sha }}
          files: |
            artifacts/*.whl
            artifacts/SHA256SUMS
          body: |
            Protocol 3 boundary refactor. Includes behavior pack 4.3.3.
            Upgrade the wheel and matching bundled behavior pack together while BDS is stopped, then fully restart. Python-only hot reload is incompatible with the older running pack.
            See README runtime identity and recovery section. Fresh join-item conflicts preserve both live items and escrow; reconcile gifts before /bot inventory <name> retry.
            Tests and wheel verification passed for the exact source commit linked by this release. Real BDS reload/join ordering remains an integration validation step.
          generate_release_notes: true
          fail_on_unmatched_files: true
