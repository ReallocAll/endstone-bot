name: Build & Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        run: python -m unittest tests.test_settings tests.test_models tests.test_bridge tests.test_behavior_pack tests.test_manager_source tests.test_level_dat tests.test_beta_script -v

      - name: Compile Python sources
        run: python -m compileall -q endstone_bot

      - name: Check behavior-pack JavaScript syntax
        run: node --check endstone_bot/behavior_pack/scripts/main.js

  wheel:
    name: Universal wheel (py3-none-any)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install build backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build universal wheel
        run: python -m build --wheel

      - name: Verify universal wheel
        shell: python
        run: |
          from pathlib import Path
          wheels = list(Path("dist").glob("*.whl"))
          assert len(wheels) == 1, wheels
          wheel = wheels[0]
          assert wheel.name.endswith("-py3-none-any.whl"), wheel.name
          print(wheel)

      - name: Verify wheel contents and entry point
        run: python -m unittest tests.test_wheel -v

      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          path: dist/*.whl
          archive: false
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: wheel
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: endstone_bot-*.whl
          path: artifacts
          merge-multiple: true
          skip-decompress: true

      - name: Create Release and attach wheel
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.whl
          generate_release_notes: true
          fail_on_unmatched_files: true
