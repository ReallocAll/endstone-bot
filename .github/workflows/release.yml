name: Build & Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    env:
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: init.defaultBranch
      GIT_CONFIG_VALUE_0: main
    name: Build wheel (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Run unit tests
        run: python -m unittest tests.test_settings tests.test_models -v

      - name: Compile Python sources
        run: python -m compileall -q endstone_bot

      - name: Build package
        run: python -m build

      - name: Verify wheel contents and entry point
        run: python -m unittest tests.test_wheel -v

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-py${{ matrix.python-version }}
          path: dist/
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          pattern: dist-*
          merge-multiple: true

      - name: Create Release and attach wheel
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.whl
          generate_release_notes: true
          fail_on_unmatched_files: true
